name: Generate Snake Animation

on:
  schedule:
    - cron: "0 18 * * *"   # daily 11:30 PM IST (18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write    # ✅ allow pushing to the repo
  pages: write       # not strictly needed here but safe
  id-token: write    # safe default for actions

jobs:
  build:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: AkashSaraswat243
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ✅ built-in token
